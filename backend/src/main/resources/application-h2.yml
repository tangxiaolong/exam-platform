# 本地开箱即用：内存 H2（MySQL 兼容模式），启动由 Flyway 建表 + 写入演示数据
spring:
  datasource:
    url: jdbc:h2:mem:exam_platform;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  db-type: h2
